<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Voice Helper</title>
<style>
  :root { --bg:#EEF3F8; --ink:#14213D; --soft:#4A5A75; --card:#FFFFFF; --accent:#1F5FD6; --accent-ink:#FFFFFF; --line:#C9D4E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0F1624; --ink:#EAF0FA; --soft:#A7B5CC; --card:#18233A; --accent:#6FA0FF; --accent-ink:#0F1624; --line:#2C3C5A; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:26px; margin:8px 0 4px; }
  p.sub { color:var(--soft); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:12px 0 6px; }
  select, input { width:100%; font:inherit; padding:14px; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--ink); }
  select { appearance:auto; }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:16px 20px; min-height:56px; cursor:pointer; background:var(--accent); color:var(--accent-ink); width:100%; }
  button.quiet { background:transparent; color:var(--soft); border:2px solid var(--line); margin-top:12px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  #status { font-weight:600; margin:12px 0; min-height:28px; }
  #log { display:flex; flex-direction:column; gap:10px; }
  .you, .bot { padding:12px 14px; border-radius:10px; border:1px solid var(--line); }
  .you { background:var(--card); }
  .bot { background:var(--card); border-left:6px solid var(--accent); }
  .who { font-size:14px; color:var(--soft); margin-bottom:2px; }
  .hidden { display:none; }
  .note { font-size:15px; color:var(--soft); }
</style>
</head>
<body>
<main>
  <h1 id="title">My Voice Helper</h1>
  <p class="sub" id="sub">Set up once. Then just tap and talk.</p>

  <section id="setup" class="card">
    <label for="name">1. What name should your helper have?</label>
    <input id="name" autocomplete="off" placeholder="For example: Jarvis">
    <label for="owner">2. What is your name?</label>
    <input id="owner" autocomplete="off" placeholder="Your name">
    <label for="prov">3. Which AI brain?</label>
    <select id="prov">
      <option value="gemini">Gemini (free key)</option>
      <option value="claude">Claude (paid key)</option>
    </select>
    <label for="key">4. Paste your API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="Paste the key here">
    <p class="note">The key is saved only on this phone. It is only sent to the AI you chose.</p>
    <button id="save">Save and start</button>
  </section>

  <section id="app" class="hidden">
    <button id="talk">Tap to talk</button>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="log"></div>
    <button id="settings" class="quiet">Change name or key</button>
  </section>
</main>

<script>
const MODEL = "claude-sonnet-5-5";
const GEMINI_MODEL = "gemini-flash-latest";
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
let history = [], busy = false, listening = false;

function show(setup){
  $("setup").classList.toggle("hidden", !setup);
  $("app").classList.toggle("hidden", setup);
  const n = store.get("name");
  $("title").textContent = n || "My Voice Helper";
  $("sub").textContent = setup ? "Set up once. Then just tap and talk." : "Tap the button, then speak.";
}
function say(text){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.onend = () => setStatus("Ready.");
  speechSynthesis.speak(u);
}
function setStatus(t){ $("status").textContent = t; }
function add(cls, who, text){
  const d = document.createElement("div"); d.className = cls;
  d.innerHTML = '<div class="who"></div><div class="t"></div>';
  d.firstChild.textContent = who; d.lastChild.textContent = text;
  $("log").prepend(d);
}
async function ask(text){
  busy = true; setStatus("Thinking...");
  history.push({role:"user", content:text});
  const name = store.get("name"), owner = store.get("owner");
  try {
    const system = `You are ${name}, a friendly voice helper for ${owner}. Speak in 1 to 3 short, plain sentences. Be calm, kind and clear. No lists or symbols.`;
    let reply;
    if (store.get("prov") === "claude") {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "content-type":"application/json",
          "x-api-key": store.get("key"),
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body: JSON.stringify({ model: MODEL, max_tokens: 400, system, messages: history.slice(-12) })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error && data.error.message || "Request failed");
      reply = data.content.map(c => c.text || "").join("").trim();
    } else {
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent", {
        method:"POST",
        headers:{ "content-type":"application/json", "x-goog-api-key": store.get("key") },
        body: JSON.stringify({
          systemInstruction: { parts:[{ text: system }] },
          contents: history.slice(-12).map(m => ({ role: m.role === "assistant" ? "model" : "user", parts:[{ text: m.content }] }))
        })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error && data.error.message || "Request failed");
      reply = (data.candidates[0].content.parts || []).map(p => p.text || "").join("").trim();
    }
    history.push({role:"assistant", content:reply});
    add("bot", name, reply); setStatus("Speaking..."); say(reply);
  } catch(e) {
    history.pop();
    setStatus("Something went wrong: " + e.message + ". Check your key, then try again.");
  }
  busy = false;
}
function listen(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStatus("This browser can't hear you. Please open this page in Chrome."); return; }
  if (busy || listening) return;
  speechSynthesis.cancel();
  const rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
  rec.onstart = () => { listening = true; setStatus("Listening..."); };
  rec.onerror = e => { listening = false; setStatus(e.error === "not-allowed" ? "Please allow the microphone, then tap again." : "I didn't catch that. Tap and try again."); };
  rec.onend = () => { listening = false; };
  rec.onresult = e => { const t = e.results[0][0].transcript; add("you", "You", t); ask(t); };
  rec.start();
}
$("save").onclick = () => {
  const n = $("name").value.trim(), o = $("owner").value.trim(), k = $("key").value.trim();
  if (!n || !o || !k) { alert("Please fill in every box."); return; }
  store.set("name", n); store.set("owner", o); store.set("key", k); store.set("prov", $("prov").value); show(false);
};
$("talk").onclick = listen;
$("settings").onclick = () => { $("name").value = store.get("name"); $("owner").value = store.get("owner"); $("key").value = ""; $("prov").value = store.get("prov") || "gemini"; show(true); };
show(!(store.get("name") && store.get("key")));
</script>
</body>
</html>
